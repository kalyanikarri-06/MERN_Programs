<!DOCTYPE html>
<html>
    <head>
        <title>
         NUMBERS FORM 1 - 10
        </title>
    </head>
    <body>
        <h2> print numbers from 1 to 10</h2>
        <script>
           var a= parseInt(prompt("Enter last number:"));
           //for loop
           document.write("For loop:<br>");
           for(var i=1;i<=a;i++)
           {
            document.write(i+" ");
           }
           //while loop
           document.write("while loop:<br>");
           var j=1;
           while(j<=a)
           {
            document.write(j+" ");
            j++;
           }
           //do while loop
           document.write("do while loop:<br>");
           var k=1;
           do{
               document.write(k+" ");
           }while(k<=a);
        </script>
    </body>
</html>
