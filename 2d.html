<!DOCTYPE html>
<html>
    <head>
        <title>CSS Box Model</title>
        <style>
            .box{
                width:250px;
                padding:25px;
                border:6px solid red;
                margin:25px;
                background-color:lightray;
                text-align:center; 
            }
        </style>
    </head>
    <body>
        <h2>CSS Box Model</h2>
        <div class ="box">
            <p>
                This is the CONTENT area <br>
                Padding gives space inside border.<br>
                Border surrunds padding.<br>
                Margin gives space outside box.
            </p>
            </div> 

    </body>
</html>
